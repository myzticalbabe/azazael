# Read by .github/workflows/pages-deploy.yml, which builds this tree with
# `mkdocs build --strict`. The workflow required a config that did not exist, so
# the job could only ever fail. Every page named below exists in docs/; a nav
# entry pointing at a missing file fails the build rather than shipping a
# broken link, which is what --strict is for.
site_name: ELIZA
site_description: BCC Re-Investigation Machinery and Therapeutic Agent, public and fully executable.

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - Explanation:
      - Why ELIZA: explanation/why-eliza.md
  - Reference:
      - Psyche: reference/psyche.md
  - Design notes:
      - Shard substrate whitepaper: WHITEPAPER_SHARD_SUBSTRATE_2026-11-02.md
      - Shard development tutorial: TUTORIAL_SHARD_DEV_2026-11-02.md
