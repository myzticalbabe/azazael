<style>
  :root { --bg: #0a0a14; --card: #111122; --accent: #00f5ff; --text: #ccd; --dim: #667; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { padding:2rem; text-align:center; border-bottom:1px solid #1a1a3a; }
  header h1 { font-size:1.8rem; color:var(--accent); }
  header p { color:var(--dim); margin-top:0.5rem; }
  .stats { display:flex; justify-content:center; gap:2rem; padding:1rem; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat .num { font-size:2rem; color:var(--accent); }
  .stat .lbl { font-size:0.8rem; color:var(--dim); }
  .tiers { display:flex; gap:0.5rem; justify-content:center; padding:1rem; flex-wrap:wrap; }
  .tier-btn { background:#111122; border:1px solid #1a1a3a; color:var(--text); padding:0.4rem 1rem; border-radius:4px; cursor:pointer; font-size:0.85rem; }
  .tier-btn:hover,.tier-btn.active { border-color:var(--accent); color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; padding:1.5rem; max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid #1a1a3a; border-radius:8px; padding:1.2rem; transition:all 0.2s; cursor:pointer; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 20px rgba(0,245,255,0.1); }
  .card h3 { font-size:1rem; color:var(--accent); margin-bottom:0.4rem; word-break:break-all; }
  .card .tier { display:inline-block; background:#1a1a3a; padding:0.1rem 0.5rem; border-radius:3px; font-size:0.7rem; color:var(--dim); margin-bottom:0.4rem; }
  .card .size { color:var(--dim); font-size:0.75rem; }
  .card .desc { color:var(--dim); font-size:0.8rem; margin-top:0.4rem; line-height:1.4; }
  .card .launch { display:inline-block; margin-top:0.6rem; color:var(--accent); font-size:0.8rem; text-decoration:none; border:1px solid var(--accent); padding:0.2rem 0.6rem; border-radius:3px; }
  .card .launch:hover { background:var(--accent); color:var(--bg); }
  .card.hidden { display:none; }
  footer { text-align:center; padding:2rem; color:var(--dim); font-size:0.75rem; border-top:1px solid #1a1a3a; }
  footer a { color:var(--accent); }
</style>
</head>

function render(filterTier) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  apps.forEach(a => {
    if (filterTier !== 'all' && a.tier !== filterTier) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<span class="tier">' + a.tier + '</span>' +
      '<h3>' + a.name + '</h3>' +
      '<span class="size">' + a.size + '</span>' +
      '<p class="desc">' + a.desc + '</p>' +
      '<a class="launch" href="' + a.name + '">Launch</a>';
    card.addEventListener('click', function(e) {
      if (e.target.tagName !== 'A') { window.location.href = a.name; }
    });
    grid.appendChild(card);
  });
  document.querySelectorAll('.tier-btn').forEach(function(b) { b.classList.remove('active'); });
  var buttons = document.querySelectorAll('.tier-btn');
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i].getAttribute('onclick') === "filter('" + filterTier + "')") {
      buttons[i].classList.add('active');
      break;
    }
  }
}
function filter(t) { render(t); }
render('all');
</script>
