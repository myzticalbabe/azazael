[package]
name = "worm-manifest"
version = "0.1.0"
edition = "2021"
description = "Fast Rust pyo3 extension for worm registry lookup — eliminates 38s Python cold-start"

[lib]
name = "worm_manifest"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
