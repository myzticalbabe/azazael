name: Pages Deploy

# Publishes this tree as a static landing site.
#
# This workflow is deliberately self-contained. Its predecessor in six of the
# publication roots ran `python tools/publicize.py`, `pip install -e ".[dev]"`
# and `mkdocs build --strict`, and none of those files existed in any of them --
# the job would have failed on its third step every time. It now depends on
# README.md alone, which every publication root is required to ship.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown

      - name: Render site
        run: python .github/scripts/render_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
