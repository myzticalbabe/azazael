[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azazael-core"
version = "3.1.0"
description = "AZAZAEL Core — Path resolution, worm registry, free-threading, and configuration engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [
    {name = "AZAZAEL Project"}
]
keywords = ["azazael", "core", "worm-registry", "free-threading", "paths"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nuitka>=2.0",
]

[project.scripts]
azazael-core = "azazael_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
