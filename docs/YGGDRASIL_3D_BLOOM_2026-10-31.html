: "src_codex_documentation_td_003_wormz_execution", "relation": "references"}, {"source": "src_codex_documentation_task_registry", "target": "src_codex_documentation_td_004_metaworms", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_changelog", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_task_registry", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_td_001_azazael_integration", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_td_002_hydra_cluster", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_td_003_wormz_execution", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_td_004_metaworms", "relation": "references"}, {"source": "src_codex_readme", "target": "src_codex_documentation_video_generation_protocol", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_horus", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_horus_horuslivemonitor", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_hydra", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_hydra_hydracluster", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_ml_platforms_file_explanations", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_tarbaby", "relation": "references"}, {"source": "src_orchestration_index", "target": "src_orchestration_tarbaby_popupmonitor", "relation": "references"}, {"source": "src_orchestration_ml_platforms_file_explanations", "target": "src_orchestration_ml_platforms_improvements_onnx_integration", "relation": "references"}, {"source": "src_orchestration_ml_platforms_file_explanations", "target": "src_orchestration_ml_platforms_improvements_qlearning_table", "relation": "references"}, {"source": "src_orchestration_ml_platforms_file_explanations", "target": "src_orchestration_ml_platforms_lm_studio_server", "relation": "references"}, {"source": "src_orchestration_ml_platforms_file_explanations", "target": "src_orchestration_ml_platforms_universal_converter", "relation": "references"}, {"source": "src_orchestration_ml_platforms_file_explanations", "target": "src_orchestration_ml_platforms_verify_moe", "relation": "references"}, {"source": "src_orchestration_paradigm", "target": "src_core_worms_concurrency", "relation": "references"}, {"source": "src_orchestration_paradigm", "target": "src_core_worms_os_congruency", "relation": "references"}, {"source": "concept_terence", "target": "src_utilities_terence_terence_terence", "relation": "references"}], "node_count": 500, "link_count": 850, "communities": ["AOA", "AZAZAEL_TOOLKIT", "CODEX", "CORE", "DAEMONS", "HYDRA", "INTERPRETERS", "META", "ML", "ORCHESTRATION", "PSYCHE", "SCRIPTS", "TOOLS", "UTILITIES", "eve_unleashed"]};

// ── Scene ──────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020408, 0.0006);

const camera = new THREE.PerspectiveCamera(55, 1920/1080, 1, 10000);
camera.position.set(0, 150, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(1920, 1080);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
container.appendChild(renderer.domElement);

// Post-processing: bloom for glow effect
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1920, 1080), 1.5, 0.4, 0.2);
composer.addPass(bloomPass);

// ── Lighting ───────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x303050, 0.4));
const lights = [
  { color: 0x7df9ff, pos: [400, 500, 600], intensity: 2.5 },
  { color: 0xffd479, pos: [-500, -200, 400], intensity: 2 },
  { color: 0xff6b6b, pos: [0, -400, -500], intensity: 1.5 },
  { color: 0xa29bfe, pos: [-300, 300, -400], intensity: 1.2 },
];
lights.forEach(l => {
  const pl = new THREE.PointLight(l.color, l.intensity, 3000);
  pl.position.set(...l.pos);
  scene.add(pl);
});

// ── Color palette ──────────────────────────────────────────────
const treeColors = {
  'CORE': 0x7df9ff, 'CODEX': 0xffd479, 'ORCHESTRATION': 0xff6b6b,
  'META': 0xa29bfe, 'UTILITIES': 0x4ecdc4, 'ML': 0x96ceb4,
  'HYDRA': 0xfd79a8, 'TOOLS': 0x6c5ce7, 'SCRIPTS': 0x00b894,
  'eve_unleashed': 0xe17055, 'PSYCHE': 0x0984e3, 'INTERPRETERS': 0x636e72,
  'DAEMONS': 0xb2bec3, 'SHARDS': 0xdfe6e9, 'AOA': 0xffeaa7,
  'AZAZAEL_TOOLKIT': 0x81ecec, 'CLI': 0x55efc4, 'default': 0x888888,
};
function getColor(g) { return treeColors[g] || treeColors['default']; }

// ── Nodes ──────────────────────────────────────────────────────
const nodes = GRAPH.nodes.map(n => ({
  ...n,
  x: (Math.random() - 0.5) * 600,
  y: (Math.random() - 0.5) * 400,
  z: (Math.random() - 0.5) * 600,
  vx: 0, vy: 0, vz: 0,
}));

const nodePositions = new Map();
nodes.forEach(n => nodePositions.set(n.id, n));

const nodeGroup = new THREE.Group();
scene.add(nodeGroup);
const nodeMeshes = [];

nodes.forEach(n => {
  const size = Math.max(1.5, Math.log2(n.val + 1) * 2.5);
  const geo = new THREE.SphereGeometry(size, 10, 6);
  const mat = new THREE.MeshPhongMaterial({
    color: getColor(n.group),
    emissive: getColor(n.group),
    emissiveIntensity: 0.5,
    shininess: 100,
    transparent: true,
    opacity: 0.9,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(n.x, n.y, n.z);
  mesh.userData = { id: n.id, label: n.label, group: n.group, val: n.val };
  nodeGroup.add(mesh);
  nodeMeshes.push({ mesh, data: n });
});

// ── Edges with glow ────────────────────────────────────────────
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
const edgeLines = [];

GRAPH.links.forEach(l => {
  const s = typeof l.source === 'string' ? l.source : l.source.id;
  const t = typeof l.target === 'string' ? l.target : l.target.id;
  const src = nodePositions.get(s), tgt = nodePositions.get(t);
  if (!src || !tgt) return;

  const isCall = l.relation === 'calls';
  const color = isCall ? 0xff6b6b : l.relation === 'imports' ? 0x4ecdc4 : 0x666688;
  const opacity = isCall ? 0.3 : 0.06;

  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(src.x, src.y, src.z),
    new THREE.Vector3(tgt.x, tgt.y, tgt.z),
  ]);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const line = new THREE.Line(geo, mat);
  edgeGroup.add(line);
  edgeLines.push({ line, src: s, tgt: t, isCall });
});

// ── Particle system (data flow) ────────────────────────────────
const particleCount = 2000;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleColors = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  const idx = Math.floor(Math.random() * nodes.length);
  const n = nodes[idx];
  particlePositions[i*3] = n.x;
  particlePositions[i*3+1] = n.y;
  particlePositions[i*3+2] = n.z;
  const c = new THREE.Color(getColor(n.group));
  particleColors[i*3] = c.r;
  particleColors[i*3+1] = c.g;
  particleColors[i*3+2] = c.b;
  particleSizes[i] = Math.random() * 2 + 0.5;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

const particleMat = new THREE.PointsMaterial({
  size: 2,
  vertexColors: true,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ── Force simulation ───────────────────────────────────────────
let simTick = 0;
const maxTicks = 80;
function simulate() {
  if (simTick >= maxTicks) return;
  simTick++;

  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
      const force = 3000 / (dist * dist);
      const fx = (dx/dist)*force, fy = (dy/dist)*force, fz = (dz/dist)*force;
      a.vx -= fx; a.vy -= fy; a.vz -= fz;
      b.vx += fx; b.vy += fy; b.vz += fz;
    }
  }

  // Attraction
  GRAPH.links.forEach(l => {
    const s = typeof l.source === 'string' ? l.source : l.source.id;
    const t = typeof l.target === 'string' ? l.target : l.target.id;
    const a = nodePositions.get(s), b = nodePositions.get(t);
    if (!a || !b) return;
    const dx = b.x-a.x, dy = b.y-a.y, dz = b.z-a.z;
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz) || 1;
    const force = (dist-80)*0.008;
    const fx=(dx/dist)*force, fy=(dy/dist)*force, fz=(dz/dist)*force;
    a.vx += fx; a.vy += fy; a.vz += fz;
    b.vx -= fx; b.vy -= fy; b.vz -= fz;
  });

  // Center gravity
  nodes.forEach(n => { n.vx -= n.x*0.0002; n.vy -= n.y*0.0002; n.vz -= n.z*0.0002; });

  // Apply
  nodes.forEach(n => {
    n.vx *= 0.88; n.vy *= 0.88; n.vz *= 0.88;
    n.x += n.vx; n.y += n.vy; n.z += n.vz;
  });

  // Update meshes
  nodeMeshes.forEach(({mesh, data}) => {
    const n = nodePositions.get(data.id);
    if (n) mesh.position.set(n.x, n.y, n.z);
  });

  // Update edges
  edgeLines.forEach(({line, src, tgt}) => {
    const s = nodePositions.get(src), t = nodePositions.get(tgt);
    if (s && t) {
      const p = line.geometry.attributes.position;
      p.setXYZ(0, s.x, s.y, s.z);
      p.setXYZ(1, t.x, t.y, t.z);
      p.needsUpdate = true;
    }
  });

  // Update particles (flow along edges)
  for (let i = 0; i < particleCount; i++) {
    if (Math.random() < 0.02) {
      // Reset particle to a random node
      const idx = Math.floor(Math.random() * nodes.length);
      const n = nodes[idx];
      particlePositions[i*3] = n.x;
      particlePositions[i*3+1] = n.y;
      particlePositions[i*3+2] = n.z;
    } else {
      // Drift toward a connected node
      const idx = Math.floor(Math.random() * nodes.length);
      const n = nodes[idx];
      particlePositions[i*3] += (n.x - particlePositions[i*3]) * 0.01;
      particlePositions[i*3+1] += (n.y - particlePositions[i*3+1]) * 0.01;
      particlePositions[i*3+2] += (n.z - particlePositions[i*3+2]) * 0.01;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;
}

// ── Animation ──────────────────────────────────────────────────
const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  simulate();

  const t = clock.getElapsedTime();
  const radius = 600;
  camera.position.x = Math.cos(t * 0.12) * radius;
  camera.position.z = Math.sin(t * 0.12) * radius;
  camera.position.y = 120 + Math.sin(t * 0.08) * 80;
  camera.lookAt(0, 0, 0);

  // Pulse lights
  lights[0].intensity = 2.5 + Math.sin(t * 0.5) * 0.5;
  lights[1].intensity = 2.0 + Math.cos(t * 0.7) * 0.3;

  composer.render();
  frameCount++;
}

// ── Caption animation ──────────────────────────────────────────
const captions = [
  'initializing neural mesh...',
  'mapping 20 trees across 750 modules...',
  'tracing 83,676 dependency edges...',
  'clustering by community: CORE, CODEX, ORCHESTRATION...',
  'note_failure: 303 call sites — the central hub...',
  '12,175 symbols · 34,771 graph edges · 18,472 control-flow paths...',
  'data flow: 98,129 variable propagation edges...',
  'rendering complete — Yggdrasil lives',
];
let capIdx = 0;
setInterval(() => {
  capIdx = (capIdx + 1) % captions.length;
  document.getElementById('cap').innerHTML = captions[capIdx].replace(/(\d[\d,]*)/g, '<b>$1</b>');
}, 2500);

setInterval(() => {
  document.getElementById('stats').textContent =
    `frame ${frameCount} | nodes ${nodes.length} | edges ${GRAPH.links.length} | particles ${particleCount} | tick ${simTick}/${maxTicks}`;
}, 500);

animate();
console.log('Yggdrasil 3D Advanced render initialized with bloom + particles');
</script>
