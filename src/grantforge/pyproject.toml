[project]
name = "grantforge"
version = "2.0.0"
description = "AI-native grant tooling: discover → assess → draft → review → collaborate → export → submit"
readme = "README.md"
authors = [{name = "Azazael"}]
# Soul Forge License v1.0, expressed as a PEP 639 SPDX `LicenseRef-` id
# because it is not an SPDX-listed licence. The older `{ text = ... }` table
# form is deprecated and setuptools refuses it from 2027-02-18.
license = "LicenseRef-Soul-Forge-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"  # Python 3.14t free-threaded
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # No "License ::" classifier: Soul Forge License v1.0 is not OSI-approved.
    # The "Apache Software License" entry that used to sit here was a leftover
    # from the CDDL-era metadata and contradicted the actual licence.
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "rich>=13.9",
    
    # AI/ML
    "torch>=2.5",  # With OpenVINO backend
    "openvino>=2024.6",
    "sentence-transformers>=3.2",
    "transformers>=4.45",
    "llama-cpp-python>=0.3.0",
    "marker-pdf>=0.2",  # PDF → Markdown
    "unstructured>=0.16",  # PDF/DOCX parsing with tables/images
    
    # Search/Embedding
    "rank-bm25>=0.2",
    "faiss-cpu>=1.8",  # Or faiss-gpu
    
    # Export
    "reportlab>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    
    # Web/Async
    "httpx>=0.27",
    "aiofiles>=24.1",
    "playwright>=1.46",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx-sse>=0.4",
    
    # Database
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    
    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# This pyproject sits INSIDE the package directory: `src/grantforge/` holds
# `__init__.py` and the six subpackages, so there is no `src/grantforge/src/`
# to discover from. `where = ["src"]` therefore aborted the build with
# "error in 'egg_base' option: 'src' does not exist or is not a directory",
# and every `pip install`/`pip wheel` from this directory failed.
#
# The packages are enumerated and this directory is mapped to the `grantforge`
# package, which is the same remapping the root pyproject performs from the
# other direction (`where = ["src"]` sees this directory as top-level
# `grantforge`). Enumerating rather than find() also keeps the build from
# silently picking up any stray directory that later gains an `__init__.py`.
[tool.setuptools]
packages = [
    "grantforge",
    "grantforge.collaboration",
    "grantforge.compliance",
    "grantforge.discovery",
    "grantforge.drafting",
    "grantforge.eligibility",
    "grantforge.export",
]
package-dir = { "grantforge" = "." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No `testpaths`: this tree ships no tests/ directory, and a testpaths entry
# pointing at a missing directory makes every bare `pytest` invocation exit 4
# with "file or directory not found" instead of collecting nothing.
testpaths = []
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
per-file-ignores = { "tests/*" = ["S101", "D100"] }  # inline table on one line

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.nuitka]
# Config loaded from grantforge.nuitka.toml
config-file = "grantforge.nuitka.toml"