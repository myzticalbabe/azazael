[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

# Thin OpenAI-compatible front end over llama-server backends.
# Routes by model name, round-robins otherwise, fails over on errors.

[dependencies]
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
