[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maat"
version = "0.1.0"
description = "MAAT - the Scales of Ma'at: multi-judge AI panel weighing for dispute opinions (3/5/7/9/11 nested panels)"
readme = "README.md"
requires-python = ">=3.10"
# Soul Forge License v1.0, expressed as a PEP 639 SPDX `LicenseRef-` id
# because it is not an SPDX-listed licence. The older `{ text = ... }` table
# form is deprecated and setuptools refuses it from 2027-02-18.
license = "LicenseRef-Soul-Forge-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Clint Oxford", email = "clintonoxford47@gmail.com" }]
keywords = ["panel", "judging", "llm", "consensus", "dispute"]
dependencies = []

[project.scripts]
maat = "maat.cli:main"

[project.urls]
Origin-Note = "Named after the scales in the Duat: Anubis weighed the heart against the Feather of Ma'at - see README.md"

[tool.setuptools.packages.find]
where = ["src"]
