[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle"
version = "0.1.0"
description = "One command over sword, defender, sentinel and memory — the composition, not a fifth part."
# There is no README.md in this tree: the document is CRADLE.md. Pointing this at
# README.md (as the sibling projects do) fails the build with a missing-file error.
readme = "CRADLE.md"
requires-python = ">=3.10"
license = { text = "CDDL-1.1" }
# No Python runtime dependencies: the Python side is stdlib-only.
#
# The composition DOES need a non-pip dependency that metadata cannot express:
# cradle.py:73 sets SWORD_TOOLS = REPO / "Project_FLAMING_SWORD" / "tools", so the
# PARTS registry resolves 0 of 5 parts inside this project. A wheel installs
# cleanly and every command then exits 1. pip can name a PyPI distribution; it
# cannot name "a directory that happens to sit next to this repository". The
# install section of CRADLE.md must say so.
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
# Author identity is deliberately absent, matching the sibling projects: this file
# was generated from a monorepo and no public attribution name is recorded yet.
# Fill `authors` in before a PyPI upload -- a placeholder name is worse than none.

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
# cradle.py sits at the project root, so the module is top-level: no package prefix.
cradle = "cradle:main"

[project.urls]
# No repository URL: the public repository does not exist yet. A guessed URL is
# a broken link.

[tool.setuptools]
# cradle.py is the only distributable module. `tests/` sits beside it and is a
# directory of test modules, not a package, so it is deliberately not declared.
py-modules = ["cradle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
