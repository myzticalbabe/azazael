name: Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.16"
          allow-prereleases: true

      - name: Materialise public tree
        run: python Project_Nurse_Ratchet/tools/publicize.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Documentation site config exists (fails closed)
        # No mkdocs.yml exists at this root, and docs/ holds evidence
        # documents rather than a site with a nav. The previous version installed
        # mkdocs and ran `build --strict` against no config at all, so the one
        # outcome it could produce was a config error nobody could act on. This
        # names the missing file instead of inventing a site in a workflow.
        # The sub-trees are a different case: Project_ELIZA and Project_Nurse_Ratchet hold real
        # Diataxis sites and carry their own mkdocs.yml, read by their own pages jobs.
        run: |
          if [ ! -f mkdocs.yml ]; then
            echo "::error::pages-deploy requires mkdocs.yml; none exists at this root."
            echo "::error::docs/ is evidence documents, not a site. Author mkdocs.yml with a nav in the owning lane."
            exit 1
          fi

      - name: Build documentation
        run: |
          python -m pip install mkdocs mkdocs-material "mkdocstrings[python]"
          mkdocs build --strict --site-dir _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4