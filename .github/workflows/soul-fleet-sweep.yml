name: Soul Fleet Sweep
on:
  schedule:
    # Weekly, Sundays 06:00 UTC -- mirrors the box schtasks leg.
    - cron: "0 6 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soul-fleet-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # No `cache: pip`. The sweep and its tests import nothing outside
          # the standard library (plus pytest), and most runs have no
          # requirements.txt, which makes setup-python fail.

      - name: Install pytest
        run: pip install pytest

      - name: Sweep tests
        run: python -m pytest tests/test_soul_fleet_sweep.py tests/test_soul_repo_scaffold.py --tb=short -q

      - name: Licence gate on this repo
        # The sweep needs a fleet of checkouts, which CI does not have;
        # here it proves its own tests pass (above) and the per-repo gate
        # holds on this tree.
        run: python tools/soul_licence_check.py
