name: Build azazael-core .exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install Nuitka
        run: pip install nuitka

      - name: Install azazael-core in dev mode
        working-directory: packages/azazael-core
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Run integration tests
        working-directory: packages/azazael-core
        run: python run_tests.py

      - name: Run pytest smoke tests (if available)
        working-directory: packages/azazael-core
        run: python -m pytest tests/ -v || echo "pytest skipped (known segfault on Python 3.13)"
        continue-on-error: true

      - name: Build .exe with Nuitka
        working-directory: packages/azazael-core
        run: |
          python -m nuitka --standalone --onefile \
            src/azazael_core/cli.py \
            -o azazael-core.exe \
            --nofollow-import-to=torch \
            --nofollow-import-to=optree \
            --nofollow-import-to=openvino

      - name: Test built .exe
        working-directory: packages/azazael-core
        run: |
          ./azazael-core.exe version
          ./azazael-core.exe registry
          ./azazael-core.exe clusters

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azazael-core
          path: packages/azazael-core/azazael-core.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/azazael-core/azazael-core.exe
          generate_release_notes: true
