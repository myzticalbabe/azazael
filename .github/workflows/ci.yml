name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  # Branch protection on `main` requires a status-check context named exactly
  # `ci`. Until this job existed the workflows here only ever published a check
  # named `test` (the job id), so the required context could never be reported
  # and every PR on this repo sat at MERGEABLE/BLOCKED forever -- measured on
  # PR #3, 2026-11-15: `gh pr checks 3` listed two `test` runs and no `ci`,
  # while `branches/main/protection` required `contexts: ["ci"]`.
  # The job id below IS the check name; renaming it re-breaks the gate.
  #
  # The blocking steps finish in minutes on purpose. The full single-process
  # suite is NOT one of them: it is not green yet, and keeping it here would
  # also hold this required check open for however long it takes to drain.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # `pyproject.toml` declares `requires-python = ">=3.15"`, so pinning the
      # job to 3.12 made `pip install -e .` fail before a single test ran
      # (measured on PR #3: "ERROR: Package 'azazael' requires a different
      # Python: 3.12.16 not in '>=3.15'"). The interpreter here must match the
      # one the project says it needs, or the job measures nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          # `.[test]` above is allowed to fall back to a bare install, and a
          # bare install brings no pytest: the 2026-11-15 run died with
          # "No module named pytest" after reporting a successful editable
          # install. requirements-test.txt is the floor that keeps the runner
          # from measuring nothing at all.
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      # BLOCKING. A collection error is a test the suite never runs, so this is
      # the cheapest honest assertion about the tree: every test module imports.
      - name: Collection check (no import errors)
        run: |
          if python -m pytest tests/ --collect-only -q > /tmp/collect.txt 2>&1; then
            tail -2 /tmp/collect.txt
          else
            echo "::error::pytest could not collect the suite"
            grep -E "^(ERROR|E  )" /tmp/collect.txt | head -40
            tail -20 /tmp/collect.txt
            exit 1
          fi

      # BLOCKING, and the project's own instrument rather than a second thinner
      # one: `tools/aggregate_suite_gate.py` compares against
      # `logs/aggregate_isolation_baseline.json` and fails only on a NEW
      # aggregate failure. The isolation profile is the dependency-light subset
      # the tool documents as reproducible off the development machine.
      # Verified on this branch 2026-11-15: 0 failed / 239 passed / 0 errors,
      # 0 blocking ids.
      - name: Aggregate isolation gate
        run: python tools/aggregate_suite_gate.py --check --profile isolation

      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            pip install basedpyright && basedpyright --version
          fi

  # NOT required by branch protection, deliberately. The full single-process
  # suite is still being worked down file by file; blocking on it today would
  # only teach people to ignore a red check. It runs so the number is visible
  # on every PR instead of living in a log. Make it required -- and delete the
  # `continue-on-error` -- once the count reaches zero.
  full-suite-report:
    name: full suite (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Full suite
        run: |
          python -m pytest tests/ -q --tb=no -p no:cacheprovider --timeout=120 | tail -40
