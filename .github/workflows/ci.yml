name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `pyproject.toml` declares `requires-python = ">=3.15"`, so pinning the
      # job to 3.12 made `pip install -e .` fail before a single test ran
      # (measured on PR #3: "ERROR: Package 'azazael' requires a different
      # Python: 3.12.16 not in '>=3.15'"). The interpreter here must match the
      # one the project says it needs, or the job measures nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi
      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            pip install basedpyright && basedpyright --version
          fi