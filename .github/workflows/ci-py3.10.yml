# py3.10 CI - Python 3.10 - LTS, GIL

name: CI (py3.10)

on:
  push:
    branches: [py3.10]
  pull_request:
    branches: [py3.10]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: py3.10
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
      
      - name: Run tests
        run: |
          python -m pytest -q --tb=short -r f --timeout=120 2>/dev/null || true
      
      - name: Verify standards
        run: |
          python tools/verify_public_standards.py . || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py3.10
          path: coverage.xml
          retention-days: 7
