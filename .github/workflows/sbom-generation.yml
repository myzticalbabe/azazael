# SBOM Generation Workflow
# Generates CycloneDX SBOM and publishes to GitHub Dependency Graph

name: SBOM Generation

on:
  push:
    # Measured 2026-11-15 (`git branch -a`): the branches that exist are
    # `origin/main` and `origin/azazael-intel-ultra-9-evo`. `master` is kept for
    # a future default, and the working branch is named because it is the one
    # that receives commits -- without it no SBOM was ever generated.
    branches: [main, master, azazael-intel-ultra-9-evo]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2AM

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --quiet cyclonedx-bom
          pip install --quiet .

      - name: Generate CycloneDX SBOM (JSON)
        uses: CycloneDX/github-action@v1
        with:
          output-format: json
          output-file: sbom.json

      - name: Generate CycloneDX SBOM (XML)
        uses: CycloneDX/github-action@v1
        with:
          output-format: xml
          output-file: sbom.xml

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
          retention-days: 90

      - name: Upload SBOM to GitHub Dependency Graph
        uses: github/dependency-submission-action@v4
        with:
          sbom-file: sbom.json

      - name: Validate SBOM
        run: |
          python -c "import json, sys; f=open('sbom.json'); sbom=json.load(f); f.close(); assert sbom.get('bomFormat')=='CycloneDX'; assert 'specVersion' in sbom; assert 'serialNumber' in sbom; assert 'version' in sbom; assert 'metadata' in sbom; assert 'components' in sbom; print('SBOM validation: PASSED'); print('Components:', len(sbom.get('components', []))); print('Version:', sbom['metadata'].get('component', {}).get('version', 'unknown'))"

      - name: Comment on PR with SBOM summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('sbom.json')) {
              const sbom = JSON.parse(fs.readFileSync('sbom.json', 'utf8'));
              const components = sbom.components?.length || 0;
              const version = sbom.metadata?.component?.version || 'unknown';
              const body = '## SBOM Generated\n\n' +
                '**Version**: ' + version + '\n' +
                '**Components**: ' + components + '\n' +
                '**Format**: CycloneDX JSON + XML\n' +
                '**Uploaded to**: GitHub Dependency Graph\n\n' +
                'Artifacts available in workflow run.';
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }