# SBOM Generation Workflow
# Generates CycloneDX SBOM and publishes to GitHub Dependency Graph

name: SBOM Generation

on:
  push:
    # Measured 2026-11-15 (`git branch -a`): the branches that exist are
    # `origin/main` and `origin/azazael-intel-ultra-9-evo`. `master` is kept for
    # a future default, and the working branch is named because it is the one
    # that receives commits -- without it no SBOM was ever generated.
    branches: [main, master, azazael-intel-ultra-9-evo]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2AM

# The dependency-submission job writes a snapshot to the repository's dependency
# graph, which the API rejects without `contents: write`. It was `read`, so that
# step could not have succeeded either.
permissions:
  contents: write
  security-events: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SBOM tool and declared runtime dependencies
        # This step used to run `pip install .`, which could never succeed:
        # pyproject.toml declares `requires-python = ">=3.16"`, so the runner's
        # interpreter rejected the package before installing it and no SBOM was
        # ever produced. The tool is installed directly and the project's own
        # declared dependencies are read out of pyproject.toml, so the SBOM still
        # describes what the project needs to run.
        run: |
          pip install --quiet cyclonedx-bom
          python - <<'PY' > runtime-requirements.txt
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print("\n".join(project.get("dependencies", [])))
          PY
          pip install --quiet -r runtime-requirements.txt

      # `CycloneDX/github-action@v1` is not a published action, so both of these
      # steps failed to resolve. The generator it wrapped is already a pip
      # package, so it is invoked directly. `--pyproject` supplies the root
      # component (`azazael 1.0.0`) without installing the package.
      - name: Generate CycloneDX SBOM (JSON)
        run: |
          python -m cyclonedx_py environment --pyproject pyproject.toml --of JSON -o sbom.json

      - name: Generate CycloneDX SBOM (XML)
        run: |
          python -m cyclonedx_py environment --pyproject pyproject.toml --of XML -o sbom.xml

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml
          retention-days: 90

      # `github/dependency-submission-action@v4` is not a published action
      # either. This is the maintained one; it scans the working tree for
      # manifests rather than reading an SBOM, hence `filePath` and `correlator`
      # instead of the old `sbom-file` input, which it does not accept.
      # Observed 2026-11-15 (run 43747420941): this step fails with
      # `The Dependency graph is disabled for this repository`. That is a
      # repository setting under Settings -> Code security, not something the
      # workflow can turn on, and the API call is refused before the action
      # uploads anything. The SBOM itself is still generated and validated by
      # the steps around this one, so a disabled dependency graph must not fail
      # the run. Once the setting is enabled the step starts succeeding on its
      # own; nothing here suppresses a real SBOM error.
      - name: Upload SBOM to GitHub Dependency Graph
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
        continue-on-error: true
        with:
          filePath: '.'
          correlator: 'azazael-sbom'

      - name: Validate SBOM
        run: |
          python -c "import json, sys; f=open('sbom.json'); sbom=json.load(f); f.close(); assert sbom.get('bomFormat')=='CycloneDX'; assert 'specVersion' in sbom; assert 'serialNumber' in sbom; assert 'version' in sbom; assert 'metadata' in sbom; assert 'components' in sbom; print('SBOM validation: PASSED'); print('Components:', len(sbom.get('components', []))); print('Version:', sbom['metadata'].get('component', {}).get('version', 'unknown'))"

      - name: Comment on PR with SBOM summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('sbom.json')) {
              const sbom = JSON.parse(fs.readFileSync('sbom.json', 'utf8'));
              const components = sbom.components?.length || 0;
              const version = sbom.metadata?.component?.version || 'unknown';
              const body = '## SBOM Generated\n\n' +
                '**Version**: ' + version + '\n' +
                '**Components**: ' + components + '\n' +
                '**Format**: CycloneDX JSON + XML\n' +
                '**Uploaded to**: GitHub Dependency Graph\n\n' +
                'Artifacts available in workflow run.';
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }