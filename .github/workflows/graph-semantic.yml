name: Graph Semantic Pipeline

# The graph itself (graphify-out/) is generated and not committed, so CI cannot
# rebuild it without the whole corpus plus graphify. What CI *can* gate is the
# pipeline that produces it: that every step parses, that the UTF-8 runner
# contract holds, that the god-node correction and the multigraph invariants are
# intact, and that no new anti-pattern enters the directory.

on:
  push:
    paths:
      - 'tools/graph_semantic/**'
      - 'tests/test_graph_semantic_pipeline.py'
      - 'tests/test_graphify_god_nodes_patch.py'
      - 'tests/test_graph_multigraph_invariants.py'
      - '.github/workflows/graph-semantic.yml'
  pull_request:
    paths:
      - 'tools/graph_semantic/**'
      - 'tests/test_graph_semantic_pipeline.py'
      - 'tests/test_graphify_god_nodes_patch.py'
      - 'tests/test_graph_multigraph_invariants.py'
      - '.github/workflows/graph-semantic.yml'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest networkx

      - name: Byte-compile every pipeline step
        run: python -m compileall -q tools/graph_semantic

      - name: Pipeline tests (UTF-8 runner, god-node patch, multigraph invariants)
        run: |
          python -m pytest \
            tests/test_graph_semantic_pipeline.py \
            tests/test_graphify_god_nodes_patch.py \
            tests/test_graph_multigraph_invariants.py \
            -q -p no:hypothesispytest

      - name: Compliance scanner on the pipeline directory (must be clean)
        # --ci makes the scanner itself exit non-zero when findings exist, so CI
        # does not have to parse the report to decide whether to fail.
        run: |
          python src/CORE/compliance/scanner.py \
            --report --dir tools/graph_semantic --severity warning --ci
