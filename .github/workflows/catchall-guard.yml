name: Catch-all Guard

on:
  push:
    paths:
      - 'src/**/*.py'
      - 'scripts/**/*.py'
      - 'tests/test_no_catch_alls.py'
      - 'requirements-test.txt'
      - '.github/workflows/catchall-guard.yml'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'scripts/**/*.py'
      - 'tests/test_no_catch_alls.py'
      - 'requirements-test.txt'
      - '.github/workflows/catchall-guard.yml'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      # This job ran its control test with no install step and died on
      # "No module named pytest" (measured 2026-11-15 on PR #3, user note: the
      # job took 16s and never executed a single assertion). A guard that never
      # runs is the exact failure this workflow exists to prevent, so the floor
      # is installed explicitly instead of trusting the runner image.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . 2>/dev/null || true; fi

      # The guard was wired into CI and its own control was not: nothing proved
      # it could still see a bare `except`. This step is that control -- it fires
      # the guard on a seeded defect and asserts it stays silent on a clean file.
      - name: Test the guard itself (negative control)
        run: |
          python -m pytest tests/test_no_catch_alls.py -q

      # `--dirs` takes ONE whitespace-split argument, not a list of argv values.
      # `--dirs src scripts` made the second word look like an option and the job
      # died with `error: unknown option scripts` (exit 2) before the guard had
      # scanned a single file -- measured 2026-11-15 on PR #3, where the run
      # looked like a guard failure but was an argument-shape failure. The
      # quoted form below is the shape the script documents and the shape that
      # was verified locally: 1030 files, 0 bare, 2801 broad, exit 0.
      - name: Run catch-all regression guard
        run: |
          status=0
          python scripts/check_no_catch_alls.py --dirs "src scripts" --json > /tmp/catchall.json || status=$?
          python - <<'PY'
          import json
          d = json.load(open('/tmp/catchall.json'))
          print(f"scanned {d['scanned_files']} files: {d['bare']} bare (max {d['max_bare']}), "
                f"{d['broad']} broad (max {d['max_broad']}) -> {'OK' if d['ok'] else 'FAIL'}")
          for loc in d['bare_findings'][:20]:
              print(f"  bare except: {loc}")
          over = len(d['broad_findings']) - d['max_broad']
          if over > 0:
              print(f"  broad count is {over} over budget; first 20:")
              for loc in d['broad_findings'][:20]:
                  print(f"    {loc}")
          PY
          # Budget is enforced inside the script:
          #   bare excepts -> always fail (MAX_BARE=0)
          #   broad excepts -> fail if the counted count exceeds MAX_BROAD, which is
          #   re-recorded from a stated measurement rather than guessed.
          # Lower MAX_BROAD in scripts/check_no_catch_alls.py as refactoring shrinks the surface.
          exit $status
