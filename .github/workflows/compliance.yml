name: Compliance Scan

on:
  push:
    paths:
      - 'src/**/*.py'
      - 'tools/**/*.py'
      - 'tests/test_anti_pattern_gate.py'
      - 'tests/test_canon_drift_check.py'
      - 'skills/**'
      - '.agents/skills/**'
      - 'logs/anti_pattern_baseline.json'
      - 'requirements-test.txt'
      - '.github/workflows/compliance.yml'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'tools/**/*.py'
      - 'tests/test_anti_pattern_gate.py'
      - 'tests/test_canon_drift_check.py'
      - 'skills/**'
      - '.agents/skills/**'
      - 'logs/anti_pattern_baseline.json'
      - 'requirements-test.txt'
      - '.github/workflows/compliance.yml'

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'

      # This job installed pip and nothing else, so its "Tests for the gates"
      # step died on "No module named pytest" (measured 2026-11-15 on PR #3).
      # The gates themselves are stdlib-only; only their tests need pytest.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      # REPORT ONLY, and marked as such.
      #
      # scanner.py exits 1 when it FINDS anything (see main(): exit 0 if
      # total_findings == 0 else 1). Under the workflow's `bash -e` that killed
      # the job before a single ratchet gate ran -- measured on PR #3: the step
      # took 40s, the run went red, and the reason was 2,206 findings in 787
      # files, which is the scanner working, not failing. The blocking decisions
      # in this workflow are the two ratchet gates at the bottom.
      #
      # stderr goes to its own file: merging it into the JSON (`2>&1`) made the
      # Summary step's json.load read a stream that was not JSON.
      - name: Run compliance scanner (JSON)
        id: scan
        continue-on-error: true
        run: |
          set +e
          python src/CORE/compliance/scanner.py --report --dir src --format json \
            > compliance_report.json 2> compliance_report.stderr.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "scanner exit code: $code (1 = findings present, by design)"
          tail -5 compliance_report.stderr.log || true
          exit 0

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-findings
          path: |
            compliance_report.json
            compliance_report.stderr.log
          if-no-files-found: warn

      - name: Generate HTML report
        continue-on-error: true
        run: |
          python src/CORE/compliance/scanner.py --report --dir src --format html \
            --output-dir compliance_html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-html-report
          path: compliance_html/
          if-no-files-found: warn

      - name: Summary
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("compliance_report.json")
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
              print(f"Files: {d['total_files']}, Findings: {d['total_findings']}, "
                    f"Files with issues: {d['files_with_findings']}")
          except Exception as exc:
              print(f"summary unavailable ({type(exc).__name__}: {exc}); "
                    "see the compliance-findings artifact")
          PY

      # The scan above only reports; these two steps GATE. They run in CI as
      # well as in the local pre-commit hook because a fresh clone has no hook
      # installed, and the audit (reports/ERROR_LESSON_AUDIT_2026-10-03.md)
      # found the mechanism built and wired to nothing that blocks.
      # The gates below were wired into CI and the tests of those gates were
      # not, so a broken instrument reported OK with nothing contradicting it.
      # tests/test_anti_pattern_gate.py was excluded from this step until
      # 2026-11-01 because its baseline-agreement test failed on the committed
      # tree (live 968 vs baseline 953 for import_inside_function). The cause was
      # not the tree: the test compared a WORKTREE scan against a baseline while
      # the gate enforces a TRACKED-ONLY one, and the 15 extra findings were all
      # in untracked scratch. `--baseline --tracked-only` was also redirected to
      # a `.partial` file the check never read. Both are fixed, the baseline is
      # re-recorded under the tracked-only predicate (and TIGHTER: silent_except
      # 5 -> 4), so the gate's own control now runs here.
      - name: Tests for the gates this workflow runs
        run: |
          python -m pytest tests/test_canon_drift_check.py -q
          python -m pytest tests/test_anti_pattern_gate.py -q

      # --tracked-only, the same predicate the pre-commit hook uses: in CI every
      # file is tracked, so the two scopes agree, and a baseline recorded under
      # one predicate is refused (exit 2) under the other rather than diffed.
      - name: Anti-pattern ratchet (fail on increase over baseline)
        run: python tools/anti_pattern_gate.py --check --tracked-only

      - name: Canon drift (skills/ vs .agents/skills/)
        run: python tools/canon_drift_check.py --check
