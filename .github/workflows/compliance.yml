name: Compliance Scan

on:
  push:
    paths:
      - 'src/**/*.py'
      - 'tools/**/*.py'
      - 'skills/**'
      - '.agents/skills/**'
      - 'logs/anti_pattern_baseline.json'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'tools/**/*.py'
      - 'skills/**'
      - '.agents/skills/**'
      - 'logs/anti_pattern_baseline.json'

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run compliance scanner (JSON)
        id: scan
        run: |
          python src/CORE/compliance/scanner.py --report --dir src --format json > compliance_report.json 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-findings
          path: compliance_report.json
          if-no-files-found: warn

      - name: Generate HTML report
        run: |
          python src/CORE/compliance/scanner.py --report --dir src --format html --output-dir compliance_html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-html-report
          path: compliance_html/
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "Compliance scan complete. Findings artifact uploaded."
          cat compliance_report.json | python -c "import sys,json; d=json.load(sys.stdin); print(f'Files: {d[\"total_files\"]}, Findings: {d[\"total_findings\"]}, Files with issues: {d[\"files_with_findings\"]}')"

      # The scan above only reports; these two steps GATE. They run in CI as
      # well as in the local pre-commit hook because a fresh clone has no hook
      # installed, and the audit (reports/ERROR_LESSON_AUDIT_2026-10-03.md)
      # found the mechanism built and wired to nothing that blocks.
      # The gates below were wired into CI and the tests of those gates were
      # not, so a broken instrument reported OK with nothing contradicting it.
      # tests/test_anti_pattern_gate.py was excluded from this step until
      # 2026-11-01 because its baseline-agreement test failed on the committed
      # tree (live 968 vs baseline 953 for import_inside_function). The cause was
      # not the tree: the test compared a WORKTREE scan against a baseline while
      # the gate enforces a TRACKED-ONLY one, and the 15 extra findings were all
      # in untracked scratch. `--baseline --tracked-only` was also redirected to
      # a `.partial` file the check never read. Both are fixed, the baseline is
      # re-recorded under the tracked-only predicate (and TIGHTER: silent_except
      # 5 -> 4), so the gate's own control now runs here.
      - name: Tests for the gates this workflow runs
        run: |
          python -m pytest tests/test_canon_drift_check.py -q
          python -m pytest tests/test_anti_pattern_gate.py -q

      # --tracked-only, the same predicate the pre-commit hook uses: in CI every
      # file is tracked, so the two scopes agree, and a baseline recorded under
      # one predicate is refused (exit 2) under the other rather than diffed.
      - name: Anti-pattern ratchet (fail on increase over baseline)
        run: python tools/anti_pattern_gate.py --check --tracked-only

      - name: Canon drift (skills/ vs .agents/skills/)
        run: python tools/canon_drift_check.py --check

