name: Compliance Scan

on:
  push:
    paths:
      - 'src/**/*.py'
  pull_request:
    paths:
      - 'src/**/*.py'

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run compliance scanner (JSON)
        id: scan
        run: |
          python src/CORE/compliance/scanner.py --report --dir src --format json > compliance_report.json 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-findings
          path: compliance_report.json
          if-no-files-found: warn

      - name: Generate HTML report
        run: |
          python src/CORE/compliance/scanner.py --report --dir src --format html --output-dir compliance_html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-html-report
          path: compliance_html/
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "Compliance scan complete. Findings artifact uploaded."
          cat compliance_report.json | python -c "import sys,json; d=json.load(sys.stdin); print(f'Files: {d[\"total_files\"]}, Findings: {d[\"total_findings\"]}, Files with issues: {d[\"files_with_findings\"]}')"
