# py3.13 CI - Python 3.13 - Stable, GIL

name: CI (py3.13)

on:
  push:
    branches: [py3.13]
  pull_request:
    branches: [py3.13]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: py3.13
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
      
      - name: Run tests
        run: |
          python -m pytest -q --tb=short -r f --timeout=120 2>/dev/null || true
      
      - name: Verify standards
        run: |
          python tools/verify_public_standards.py . || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py3.13
          path: coverage.xml
          retention-days: 7
