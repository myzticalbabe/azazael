# CodeQL Analysis Workflow
# Static analysis for security vulnerabilities

name: CodeQL Analysis

on:
  push:
    # Measured 2026-11-15 (`git branch -a`): the branches that exist are
    # `origin/main` and `origin/azazael-intel-ultra-9-evo`. This filter used to
    # name `master`, which exists nowhere, and omitted the working branch, where
    # every commit actually lands -- so the analysis ran on neither.
    branches: [main, master, azazael-intel-ultra-9-evo]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --quiet -e . 2>/dev/null || true
          pip install --quiet pytest 2>/dev/null || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # JavaScript/TypeScript analysis for HTML projects
  analyze-js:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    if: "hashFiles('**/*.js', '**/*.ts', '**/*.html') != ''"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          upload: true