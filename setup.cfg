[metadata]
name = azazael
version = 1.0.0
description = Azazael — self-replicating AI worm ecosystem for autonomous system administration
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Operating System :: Microsoft :: Windows

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.14
install_requires =
    psutil>=7.2.2,<8

# REQUIRES Python 3.14t (free-threaded build). The GIL-disabled build is
# mandatory for concurrent worm execution (CLUSTERWORMS, CONCURRENCY).
# Standard Python 3.14 (non-free-threaded) will also work but with
# degraded parallel performance.

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    azazael-ctl = CORE.azazael_ctl:main
    azazael-doctor = CORE.doctor:cmd_doctor
    azazael-maintain = CORE.data_retention:cmd_maintain
    azazael-observability = CORE.metrics:cmd_metrics
    azazael-backup = CORE.backup:incremental_backup
    azazael-doctor-full = CORE.doctor:run_all
