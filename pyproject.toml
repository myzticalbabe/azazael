[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azazael"
version = "1.0.0"
description = "Azazael — self-replicating AI worm ecosystem for autonomous system administration"
readme = "README.md"
# PEP 639 SPDX expression. Soul Forge License v1.0 is not an SPDX-listed licence,
# so it is expressed as a `LicenseRef-` id and the full text ships as LICENSE.
# The older `license = { text = "..." }` table form is deprecated and setuptools
# refuses it from 2027-02-18, which is why it is not used here.
license = "LicenseRef-Soul-Forge-1.0"
license-files = ["LICENSE"]
# Requires Python 3.14+. Measured on 3.14.7 (free-threaded build), which is what
# this tree's full suite is verified against.
#
# A GIL-disabled build (`python3.14t`) is what CLUSTERWORMS and CONCURRENCY are
# tuned for, but it is a performance recommendation, not an import requirement:
# the same 3.14 interpreter runs with the GIL enabled and still passes.
#
# No later interpreter is claimed here because none is verified — the local
# 3.15.0rc3 install has a broken psutil C extension, so a `>=3.15` floor would be
# a claim with no evidence behind it.
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "psutil>=7.2.2,<8",
]

[project.scripts]
azazael-ctl = "CORE.azazael_ctl:main"
azazael-doctor = "CORE.doctor:cmd_doctor"
azazael-maintain = "CORE.data_retention:cmd_maintain"
azazael-observability = "CORE.metrics:cmd_metrics"
azazael-backup = "CORE.backup:incremental_backup"
azazael-doctor-full = "CORE.doctor:run_all"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/META/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
exclude = [
    # Thin backward-compat wrappers that import from AZAZAEL_TOOLKIT/
    "src/azazael_toolkit.py",
    "src/COMPREHENSIVE_FIX.py",
    "src/environment_manager.py",
    "src/math_certainty.py",
    "src/QL_ANALYSIS.py",
    "src/REAL_FRAMEWORK_TEST.py",
    "src/update_docs_paths.py",
]

# sklearn ships no py.typed marker; any importer would trip import-untyped.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
