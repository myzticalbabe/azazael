[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "azazael"
version = "1.0.0"
description = "Azazael — self-replicating AI worm ecosystem for autonomous system administration"
readme = "README.md"
# REQUIRES Python 3.15t (free-threaded build). The GIL-disabled build is
# mandatory for concurrent worm execution (CLUSTERWORMS, CONCURRENCY).
# Standard Python 3.15 (non-free-threaded) will also work but with
# degraded parallel performance.
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "psutil>=7.2.2,<8",
    # Used by `ClusterWORMZ.build_from_category` to read the per-category
    # timeouts/parallel flags out of `azazael.yaml`. Undeclared until
    # 2026-11-15, where it showed up as a silently degraded config rather than
    # an ImportError: on an interpreter without PyYAML the loader fell back to
    # cluster defaults, so `"monitor"` reported timeout 60 instead of the 30
    # the YAML specifies and `tests/test_clusterworms_unit.py::
    # TestClusterWORMZCategoryConfig` failed on CI's Python 3.15 while passing
    # on a machine that happened to have PyYAML installed globally.
    "PyYAML>=6,<7",
    # 32 modules under `src/` import numpy at module level and nothing guards
    # the import, so it is a hard requirement of the installed package, not a
    # test-only convenience. It was also undeclared until 2026-11-15: on a
    # clean runner `pytest --collect-only` reported 12 errors -- all of them
    # `ModuleNotFoundError: No module named 'numpy'` or `'pydantic'` -- which
    # is a suite that cannot be collected rather than a suite that fails.
    "numpy>=2,<3",
    "pydantic>=2,<3",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/META/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
exclude = [
    # Thin backward-compat wrappers that import from AZAZAEL_TOOLKIT/
    "src/azazael_toolkit.py",
    "src/COMPREHENSIVE_FIX.py",
    "src/environment_manager.py",
    "src/math_certainty.py",
    "src/QL_ANALYSIS.py",
    "src/REAL_FRAMEWORK_TEST.py",
    "src/update_docs_paths.py",
]

# sklearn ships no py.typed marker; any importer would trip import-untyped.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[project.scripts]
azazael-ctl = "CORE.azazael_ctl:main"
azazael-doctor = "CORE.doctor:cmd_doctor"
azazael-maintain = "CORE.data_retention:cmd_maintain"
azazael-observability = "CORE.metrics:cmd_metrics"
azazael-backup = "CORE.backup:incremental_backup"
azazael-doctor-full = "CORE.doctor:run_all"

[tool.setuptools.packages.find]
where = ["src"]
